name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  installers:
    uses: ./.github/workflows/installers.yml

  publish:
    name: Verify and publish to npm
    needs: installers
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Verify tag matches package version
        run: node -e "const p=require('./package.json'); const tag=process.env.GITHUB_REF_NAME; if (tag !== 'v'+p.version) process.exit(1)"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run
      - run: npm audit --omit=dev
      - run: npm run release:publish

  release:
    name: Create GitHub Release
    needs: [publish, installers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download tested installers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: canvas-*
          merge-multiple: true
          path: release-assets
      - name: Prepare release for final review
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --generate-notes --draft
